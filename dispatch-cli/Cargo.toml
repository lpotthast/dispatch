[package]
name = "dispatch-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dispatch"
path = "src/main.rs"

[dependencies]
crudkit-core = { path = "../crudkit/crudkit-core" }
clap = { version = "4", features = ["derive", "env"] }
dispatch-api-client = { path = "../dispatch-api-client" }
dispatch-types = { path = "../dispatch-types" }
rootcause = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.20.0", default-features = false, features = ["std", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.19", features = ["v4"] }

[dev-dependencies]
assertr = "0.6.0"
