[package]
name = "dispatch-server"
version = "0.1.0"
edition = "2024"

[package.metadata.leptonic]
style-dir = "style"

[package.metadata.leptos]
hash-files = false
hash-file-name = "hash.txt"
lib-cargo-args = []
bin-cargo-args = []
output-name = "dispatch"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:4000"
reload-port = 4001
reload-protocol = "ws"
watch = false
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
graceful-shutdown = true
graceful-shutdown-timeout-secs = 3
graceful-shutdown-unix-signal = "SIGTERM"

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "browser_test"
path = "tests/browser_test.rs"
required-features = ["browser-tests"]

[[test]]
name = "browser_test_signals"
path = "tests/browser_test_signals.rs"
required-features = ["browser-tests"]

[features]
default = ["ssr"]
browser-tests = ["dep:browser-test", "dep:leptos-browser-test"]
hydrate = [
    "dep:pulldown-cmark",
    "dep:codee",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:indexmap",
    "dep:leptos-use",
    "dep:serde",
    "dep:serde_json",
    "dep:time",
    "dep:typetag",
    "dep:urlencoding",
    "dep:uuid",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "leptos/hydrate",
    "leptonic/hydrate",
    "uuid/js",
]
ssr = [
    "dep:async-stream",
    "dep:async-trait",
    "dep:axum",
    "dep:axum-macros",
    "dep:clap",
    "dep:codee",
    "dep:codex-app-server-sdk",
    "dep:crudkit-core",
    "dep:crudkit-rs",
    "dep:crudkit-sea-orm",
    "dep:futures-core",
    "dep:gloo-timers",
    "dep:git2",
    "dep:htmd",
    "dep:indexmap",
    "dep:libc",
    "dep:leptos-use",
    "dep:leptos_axum",
    "dep:metrics",
    "dep:paste",
    "dep:rootcause",
    "dep:pulldown-cmark",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:time",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-process-tools",
    "dep:tracing-subscriber",
    "dep:typetag",
    "dep:utoipa",
    "dep:urlencoding",
    "dep:uuid",
    "dep:yaml_serde",
    "dep:ignore",
    "leptos/ssr",
    "leptos-use/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptonic/ssr",
]

[dependencies]
ignore = { version = "=0.4.23", default-features = false, optional = true }
async-stream = { version = "0.3", default-features = false, optional = true }
async-trait = { version = "0.1", default-features = false, optional = true }
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "ws"], optional = true }
axum-macros = { version = "0.5", default-features = false, optional = true }
browser-test = { version = "0.5.0", path = "../../browser-test", default-features = false, optional = true }
clap = { version = "4", default-features = false, features = ["color", "derive", "env", "error-context", "help", "std", "suggestions", "usage"], optional = true }
codee = { version = "0.3.5", default-features = false, features = ["json_serde"], optional = true }
codex-app-server-sdk = { version = "0.5.1", default-features = false, optional = true }
crudkit-core = { path = "../crudkit/crudkit-core", default-features = false, optional = true }
crudkit-leptos = { path = "../crudkit/crudkit-leptos", default-features = false }
crudkit-rs = { path = "../crudkit/crudkit-rs", default-features = false, optional = true }
crudkit-sea-orm = { path = "../crudkit/crudkit-sea-orm", default-features = false, optional = true }
futures-core = { version = "0.3", default-features = false, optional = true }
git2 = { version = "0.20", default-features = false, optional = true }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"], optional = true }
gloo-timers = { version = "0.3", default-features = false, features = ["futures"], optional = true }
htmd = { version = "0.5.4", default-features = false, optional = true }
indexmap = { version = "2", default-features = false, features = ["serde", "std"], optional = true }
libc = { version = "0.2", default-features = false, optional = true }
leptonic = { version = "0.5.0", git = "https://github.com/lpotthast/leptonic", branch = "migrate-to-leptos-0.8", default-features = false, features = ["tiptap"] }
leptos-browser-test = { version = "0.4.0", path = "../../leptos-browser-test", default-features = false, optional = true }
leptos = { version = "0.8.19", default-features = false }
leptos-use = { version = "0.18.3", default-features = false, features = ["storage", "use_element_size", "use_interval_fn", "use_media_query", "use_websocket"], optional = true }
# The static-file/error handler is gated by leptos_axum's indivisible `default` feature.
leptos_axum = { version = "=0.8.7", default-features = false, features = ["default"], optional = true }
metrics = { version = "0.24.6", default-features = false, optional = true }
leptos_meta = { version = "=0.8.5", default-features = false }
leptos-routes = { version = "0.4.1", default-features = false }
leptos_router = { version = "=0.8.11", default-features = false }
paste = { version = "1", default-features = false, optional = true }
dispatch-types = { path = "../dispatch-types", default-features = false }
rootcause = { version = "0.13.0", default-features = false, optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
sea-orm = { version = "0.12.15", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite"], optional = true }
shlex = { version = "2", default-features = false }
sea-orm-migration = { version = "0.12.15", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"], optional = true }
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
time = { version = "=0.3.47", default-features = false, features = ["formatting", "parsing"], optional = true }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["rt"], optional = true }
tokio-process-tools = { version = "0.11.2", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "json", "tracing-log"], optional = true }
typetag = { version = "0.2", default-features = false, optional = true }
utoipa = { version = "5", default-features = false, features = ["macros"], optional = true }
urlencoding = { version = "2", default-features = false, optional = true }
yaml_serde = { version = "0.10", default-features = false, optional = true }
uuid = { version = "1.19.0", default-features = false, features = ["v4"], optional = true }
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "0.4", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
assertr = { version = "0.6.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json"] }
tempfile = { version = "3", default-features = false, features = ["getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", default-features = false, features = ["wasm_js"] }
web-sys = { version = "0.3", default-features = false, features = ["Blob", "Document", "DomRect", "Element", "File", "FileList", "History", "HtmlElement", "HtmlInputElement", "PointerEvent", "Window", "std"], optional = true }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
debug = false
codegen-units = 1
panic = "abort"
